[project]
name = "ten-minute-version"
version = "0.1.0"
description = "Player ratings for college basketball, from lineup-vs-lineup possessions"
requires-python = ">=3.14"
authors = []
dependencies = [
    # The plays come in as endgame's processed parquet and the stints go out
    # as parquet, so arrow is the package's whole interface rather than an
    # optional reader the way it is in the-lucky-ones.
    "pyarrow>=21.0.0",
    # The on-floor probabilities: a logistic regression small enough to fit
    # with Newton steps, so numpy rather than a solver.
    "numpy>=2.3.0",
    "scipy>=1.16",
    # Which division a team from outside Division I is in (`divisions`).
    # Unpinned here, so Cassandra's pin is the one it installs beside this
    # package; this repo's own environment pins it below.
    "call-it-what-you-want",
]

[tool.uv.sources]
call-it-what-you-want = { git = "https://github.com/NathanDeMaria/call-it-what-you-want.git", rev = "472c117a90769bb3dbea02316f86a7aaf5c2c83c" }

[dependency-groups]
dev = [
    # `build.py`'s CLI.
    "fire>=0.7.1",
    "pytest>=9.0.2",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ten_minute_version"]

# Below here is the template's. `copier update` brings changes to it from
# mirrorball, so per-repo additions are better made as new keys than as edits.

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F), import sorting, and pyupgrade -- which
# reads requires-python to decide what's outdated.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ten_minute_version"]

[tool.ty.terminal]
# A warning fails `make check` and CI, same as an error. Silence one on purpose
# with `# ty: ignore[rule]`, which ty itself flags once it's no longer needed.
error-on-warning = true

[tool.pytest]
# Unknown markers, bad config keys and xfails that pass are failures.
strict = true
# Not into the local data (`make plays`, `make summaries`): walking every
# season's summaries takes pytest 15 s. The rest are pytest's own defaults.
norecursedirs = ["plays", "stints", "summaries", ".*", "build", "dist", "*.egg", "venv"]
