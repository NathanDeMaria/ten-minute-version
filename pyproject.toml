[project]
name = "ten-minute-version"
version = "0.1.0"
description = "Player ratings for college basketball, from lineup-vs-lineup possessions"
requires-python = ">=3.14"
authors = []
dependencies = [
    # The plays come in as endgame's processed parquet and the stints go out
    # as parquet, so arrow is the package's whole interface rather than an
    # optional reader the way it is in the-lucky-ones.
    "pyarrow>=21.0.0",
]

[dependency-groups]
dev = [
    # `build.py`'s CLI.
    "fire>=0.7.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "ty>=0.0.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ten_minute_version"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# "I" is import sorting, which `make lint` fixes in place. "F" is pyflakes.
select = ["I", "F"]

[tool.ruff.lint.isort]
known-first-party = ["ten_minute_version"]
